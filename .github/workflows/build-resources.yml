# resources/ の MD が push されたときに resources.json を生成し、リポジトリにコミットする
name: Build resources.json

on:
  push:
    paths:
      - 'resources/**'
      - 'scripts/build_resources_json.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Build resources.json
        run: python scripts/build_resources_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/resources.json
          git diff --staged --quiet || (git commit -m "chore: update resources.json from resources" && git push)
