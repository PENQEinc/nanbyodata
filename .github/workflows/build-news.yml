# posts/ の MD が push されたときに news.json を生成し、リポジトリにコミットする
name: Build news.json

on:
  push:
    paths:
      - 'posts/**'
      - 'scripts/build_news_json.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml markdown2

      - name: Build news.json
        run: python scripts/build_news_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/news.json
          git diff --staged --quiet || (git commit -m "chore: update news.json from posts" && git push)
