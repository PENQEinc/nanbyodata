<!doctype html>
<html lang="ja">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- SEO -->
  <title>News | NanbyoData</title>
  <meta name="description" content="NanbyoDataのNewsページです." />
  <meta property="og:site_name" content="NanbyoData" />
  <meta property="og:title" content="News| NanbyoData" />
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nanbyodata.jp/news" />
  <meta property="og:description" content="NanbyoDataのNewsページです." />
  <meta property="og:image" content="/static/img/ogp_img.png" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="https://indestructibletype-fonthosting.github.io/renner.css" type="text/css"
    charset="utf-8" />
  <link href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="/static/sass/main.css">

  <!-- favicon -->
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">

</head>

<body>
  <main>
    <!-- Navigation -->
    {% include 'component/navigation.html' %}

    <div class="page-layout" id="news-page">
      <header class="page-title">
        <h2>News</h2>
      </header>

      <div class="news-page-container">
        <aside class="news-sidebar">
          <div class="sidebar-section">
            <h3 class="sidebar-title">
              <i class="fas fa-calendar-alt sidebar-icon" aria-hidden="true"></i>
              Year
            </h3>
            <ul class="sidebar-options" id="news-year-options"></ul>
          </div>
          <div class="sidebar-section">
            <h3 class="sidebar-title">
              <i class="fas fa-tag sidebar-icon" aria-hidden="true"></i>
              Tags
            </h3>
            <ul class="sidebar-options" id="news-tag-options"></ul>
          </div>
        </aside>

        <div class="news-main">
          <!-- 一覧表示エリア -->
          <div id="news-list-view">
            <h2 class="news-list-title" id="news-list-title"></h2>
            <ul class="news-list" id="news-list"></ul>
          </div>
          <!-- 詳細表示エリア -->
          <div id="news-detail-view" style="display: none;">
            <h2 class="news-detail-title" id="news-detail-title"></h2>
            <div class="news-detail-meta">
              <span class="news-detail-date" id="news-detail-date"></span>
              <div class="news-detail-tags" id="news-detail-tags"></div>
            </div>
            <div class="news-detail-body post-content" id="news-detail-body"></div>
          </div>
          <div id="news-loading" class="news-loading-state" style="display: none;"></div>
          <div id="news-error" class="news-error-state" style="display: none;"></div>
        </div>
      </div>
    </div>

    {% include 'component/footer.html' %}

    <!--- NanbyoData利用規約 modal -->
    {% if get_locale() == "ja" or get_locale() == "ja_JP" %}
    {% include 'component/modal-tos.html' %}
    {% else %}
    {% include 'component/modal-tos_en.html' %}
    {% endif %}
  </main>

  <!-- Optional JavaScript -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous">
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"
    integrity="sha384-xrRywqdh3PHs8keKZN+8zzc5TX0GRTLCcmivcbNJWm2rs5C8PRhcEn3czEjhAO9o" crossorigin="anonymous">
  </script>
  <script type="module" src="/static/js/main.js"></script>
  <script type="module" src="/static/js/news/news.js"></script>
</body>

</html>
